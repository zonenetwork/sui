image: atlassian/default-image:4

definitions:
  services:
    docker:
      memory: 7128

  steps:
    - step: &build-docker-services
        name: Build and Push Docker Services
        services:
          - docker
        script:
          - export DOCKER_BUILDKIT=1
          
          # Set semantic versioning
          - |
            if [ "${BITBUCKET_BRANCH}" = "master" ]; then
              VERSION="${BITBUCKET_BUILD_NUMBER}"
              MAJOR=$(echo $VERSION | cut -c1)
              MINOR=$(echo $VERSION | cut -c2-3 | sed 's/^0*//')
              PATCH=$(echo $VERSION | cut -c4- | sed 's/^0*//')
              if [ -z "$MINOR" ]; then MINOR="0"; fi
              if [ -z "$PATCH" ]; then PATCH="0"; fi
              VERSION_TAG="${MAJOR}.${MINOR}.${PATCH}"
            else
              VERSION_TAG="${BITBUCKET_BUILD_NUMBER}-dev"
            fi
          
          - echo "Version tag: $VERSION_TAG"
          
          # Login to Azure Container Registry
          - echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL -u $REGISTRY_USERNAME --password-stdin
          
          # Build all services dynamically
          - |
            cd docker
            for SERVICE_DIR in */; do
              if [ -d "$SERVICE_DIR" ] && [ -f "${SERVICE_DIR}Dockerfile" ]; then
                SERVICE_NAME=$(basename "$SERVICE_DIR")
                echo "Building service: $SERVICE_NAME"
                
                IMAGE_TAG="${REGISTRY_URL}/${SERVICE_NAME}:${VERSION_TAG}"
                IMAGE_TAG_LATEST="${REGISTRY_URL}/${SERVICE_NAME}:latest"
                
                cd "$SERVICE_DIR"
                
                # Use build.sh if available, otherwise direct docker build
                if [ -f "build.sh" ]; then
                  echo "Using build.sh for $SERVICE_NAME"
                  chmod +x build.sh
                  ./build.sh -t $IMAGE_TAG \
                    --build-arg BUILD_DATE=$(date -u +'%Y-%m-%d') \
                    --build-arg GIT_REVISION=$(git rev-parse --short HEAD)
                else
                  echo "Using direct docker build for $SERVICE_NAME"
                  docker build -f Dockerfile ../.. \
                    -t $IMAGE_TAG \
                    --build-arg BUILD_DATE=$(date -u +'%Y-%m-%d') \
                    --build-arg GIT_REVISION=$(git rev-parse --short HEAD)
                fi
                
                # Push versioned image
                docker push $IMAGE_TAG
                
                # Tag and push latest for master branch
                if [ "${BITBUCKET_BRANCH}" = "master" ]; then
                  docker tag $IMAGE_TAG $IMAGE_TAG_LATEST
                  docker push $IMAGE_TAG_LATEST
                fi
                
                # Cleanup
                docker rmi $IMAGE_TAG || true
                if [ "${BITBUCKET_BRANCH}" = "master" ]; then
                  docker rmi $IMAGE_TAG_LATEST || true
                fi
                
                cd ..
              fi
            done

    - step: &build-specific-services
        name: Build Changed Services
        services:
          - docker
        script:
          - export DOCKER_BUILDKIT=1
          
          # Set semantic versioning
          - |
            if [ "${BITBUCKET_BRANCH}" = "master" ]; then
              VERSION="${BITBUCKET_BUILD_NUMBER}"
              MAJOR=$(echo $VERSION | cut -c1)
              MINOR=$(echo $VERSION | cut -c2-3 | sed 's/^0*//')
              PATCH=$(echo $VERSION | cut -c4- | sed 's/^0*//')
              if [ -z "$MINOR" ]; then MINOR="0"; fi
              if [ -z "$PATCH" ]; then PATCH="0"; fi
              VERSION_TAG="${MAJOR}.${MINOR}.${PATCH}"
            else
              VERSION_TAG="${BITBUCKET_BUILD_NUMBER}-dev"
            fi
          
          - echo "Version tag: $VERSION_TAG"
          
          # Login to Azure Container Registry
          - echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL -u $REGISTRY_USERNAME --password-stdin
          
          # Define services with build.sh
          - |
            SERVICES_WITH_BUILD_SH="sui-tools sui-source-service sui-services sui-node sui-node-deterministic sui-indexer sui-indexer-alt sui-indexer-alt-jsonrpc sui-indexer-alt-graphql sui-graphql-rpc sui-graphql-rpc-staging sui-bridge-indexer multisig-toolkit deterministic-canary"
          
          # Define services with Dockerfile only
          - |
            SERVICES_DOCKERFILE_ONLY="sui-proxy sui-kv-rpc sui-indexer-tidb sui-edge-proxy sui-antithesis sui-analytics-indexer stress"
          
          # Build services that have changes
          - |
            cd docker
            for SERVICE_NAME in $SERVICES_WITH_BUILD_SH $SERVICES_DOCKERFILE_ONLY; do
              if [ -d "$SERVICE_NAME" ]; then
                echo "Building service: $SERVICE_NAME"
                
                IMAGE_TAG="${REGISTRY_URL}/${SERVICE_NAME}:${VERSION_TAG}"
                IMAGE_TAG_LATEST="${REGISTRY_URL}/${SERVICE_NAME}:latest"
                
                cd "$SERVICE_NAME"
                
                # Use build.sh if available
                if [ -f "build.sh" ]; then
                  echo "Using build.sh for $SERVICE_NAME"
                  chmod +x build.sh
                  ./build.sh -t $IMAGE_TAG \
                    --build-arg BUILD_DATE=$(date -u +'%Y-%m-%d') \
                    --build-arg GIT_REVISION=$(git rev-parse --short HEAD)
                else
                  echo "Using direct docker build for $SERVICE_NAME"
                  docker build -f Dockerfile ../.. \
                    -t $IMAGE_TAG \
                    --build-arg BUILD_DATE=$(date -u +'%Y-%m-%d') \
                    --build-arg GIT_REVISION=$(git rev-parse --short HEAD)
                fi
                
                # Push versioned image
                docker push $IMAGE_TAG
                
                # Tag and push latest for master branch
                if [ "${BITBUCKET_BRANCH}" = "master" ]; then
                  docker tag $IMAGE_TAG $IMAGE_TAG_LATEST
                  docker push $IMAGE_TAG_LATEST
                fi
                
                # Cleanup
                docker rmi $IMAGE_TAG || true
                if [ "${BITBUCKET_BRANCH}" = "master" ]; then
                  docker rmi $IMAGE_TAG_LATEST || true
                fi
                
                cd ..
              fi
            done

pipelines:
  default:
    - step:
        <<: *build-specific-services
        condition:
          changesets:
            includePaths:
              - "docker/**"
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "consensus/**"
              - "sui-execution/**"
              - "external-crates/**"

  branches:
    master:
      - step:
          <<: *build-specific-services
          name: Build All Services - Master Branch

  custom:
    # Manual build all services
    build-all:
      - step:
          <<: *build-docker-services
          name: Manual Build All Services

    # Build specific service manually
    build-service:
      - variables:
          - name: SERVICE_NAME
            description: Name of the service to build (folder name in docker/)
            required: true
      - step:
          name: Build Specific Service
          services:
            - docker
          script:
            - export DOCKER_BUILDKIT=1
            
            # Set semantic versioning
            - |
              if [ "${BITBUCKET_BRANCH}" = "master" ]; then
                VERSION="${BITBUCKET_BUILD_NUMBER}"
                MAJOR=$(echo $VERSION | cut -c1)
                MINOR=$(echo $VERSION | cut -c2-3 | sed 's/^0*//')
                PATCH=$(echo $VERSION | cut -c4- | sed 's/^0*//')
                if [ -z "$MINOR" ]; then MINOR="0"; fi
                if [ -z "$PATCH" ]; then PATCH="0"; fi
                VERSION_TAG="${MAJOR}.${MINOR}.${PATCH}"
              else
                VERSION_TAG="${BITBUCKET_BUILD_NUMBER}-dev"
              fi
            
            - |
              echo "Building service: $SERVICE_NAME with version: $VERSION_TAG"
            
            # Login to Azure Container Registry
            - |
              echo $REGISTRY_PASSWORD | docker login $REGISTRY_URL -u $REGISTRY_USERNAME --password-stdin
            
            # Check if service directory exists
            - |
              if [ ! -d "docker/$SERVICE_NAME" ]; then
                echo "Error: Service directory docker/$SERVICE_NAME does not exist"
                exit 1
              fi
            
            - cd "docker/$SERVICE_NAME"
            
            # Build the service
            - |
              IMAGE_TAG="${REGISTRY_URL}/${SERVICE_NAME}:${VERSION_TAG}"
              IMAGE_TAG_LATEST="${REGISTRY_URL}/${SERVICE_NAME}:latest"
              
              if [ -f "build.sh" ]; then
                echo "Using build.sh for $SERVICE_NAME"
                chmod +x build.sh
                ./build.sh -t $IMAGE_TAG \
                  --build-arg BUILD_DATE=$(date -u +'%Y-%m-%d') \
                  --build-arg GIT_REVISION=$(git rev-parse --short HEAD)
              else
                echo "Using direct docker build for $SERVICE_NAME"
                docker build -f Dockerfile ../.. \
                  -t $IMAGE_TAG \
                  --build-arg BUILD_DATE=$(date -u +'%Y-%m-%d') \
                  --build-arg GIT_REVISION=$(git rev-parse --short HEAD)
              fi
              
              # Push versioned image
              docker push $IMAGE_TAG
              
              # Tag and push latest for master branch
              if [ "${BITBUCKET_BRANCH}" = "master" ]; then
                docker tag $IMAGE_TAG $IMAGE_TAG_LATEST
                docker push $IMAGE_TAG_LATEST
              fi

